<!--
  Root HTML document for the Med Life AI frontend.
  The empty #root div is where React mounts. Vite injects /src/main.tsx as the
  JavaScript entry, which then renders the router, auth provider, and pages.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Med Life AI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
